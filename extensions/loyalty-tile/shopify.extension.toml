# Kept in step with the Admin API version in ../../shopify.app.toml and
# web/config/shopify.php. ShopifyConfigurationTest fails the build on drift.
api_version = "2026-07"

[[extensions]]
type = "ui_extension"
# Change the merchant-facing name of the extension in locales/en.default.json
name = "t:name"
uid = "89f49274-9306-39db-7d67-b4aa47040a0c51788193"
handle = "loyalty-tile"
description = "A preact POS UI extension"

# module: file that contains your extension’s source code
# target: location where your extension appears in POS
[[extensions.targeting]]
module = "./src/Tile.jsx"
target = "pos.home.tile.render"

[[extensions.targeting]]
module = "./src/Modal.jsx"
target = "pos.home.modal.render"
